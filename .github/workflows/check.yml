name: Check and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run python scripts/build.py
      - run: uv run python examples/surface_code.py --shots 1000 --noise 0
      - run: uv run python examples/construct_circuit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/lattice.js
      - run: node --check web/notation.js
      - run: node --check web/surface-view.js
      - run: node --check web/lattice-lesson.js
      - run: node --check web/surface-check.js
      - run: node --check web/circuit-guide.js
      - run: node tests/lattice.cjs
      - run: node tests/lattice-schedule.cjs
